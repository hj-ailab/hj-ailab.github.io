lab:
  name: 'HJ AILAB'
  tagline: >-
    We take on the frontier of full-duplex spoken dialogue models that listen and speak simultaneously.
  intro: >-
    HJ AILAB is a two-person independent AI research lab founded in 2023, and its core researchers are Hyunjong Ok and Suho Yoo. As graduate students at POSTECH and KAIST, we run the lab alongside our degrees. Our goal is full-duplex spoken dialogue, where models listen and speak simultaneously and handle turn-taking, interruptions, and backchannels in real time. Toward that goal, we publish research on speech, multimodal, and language models at venues including NeurIPS, ACL, EMNLP, NAACL, and ICASSP.
  about: >-
    HJ AILAB is a two-person independent AI research lab founded in 2023. Its core researchers are Hyunjong Ok and Suho Yoo, graduate students at POSTECH and KAIST who run the lab alongside their degrees. Our goal is full-duplex spoken dialogue, where models listen and speak at the same time and handle turn-taking, interruptions, and backchannels in real time. Toward that goal, we measure what speech, multimodal, and language models can actually do, make speech and omni models fast enough for live conversation, and study auditory knowledge, attention, and how language models write network weights.

themes:
  - id: 'evaluation'
    title: 'Evaluation Toward Spoken Dialogue'
    bullet: 'Measuring what speech, multimodal, and language models can do to support full-duplex evaluation.'
    summary: >-
      Evaluating future full-duplex systems requires reliable tests of listening, timing, and interactive conversation. We study how to measure what speech, multimodal, and language models can actually do, including voice-agent and simulator-based evaluation of spoken conversation. Representative work includes TempCore, AuditoryBench++, evaluation bias analysis in One Bias Score, Two Factors, and Hierarchical Compression of Vision-Language Model Benchmarks.
  - id: 'efficiency'
    title: 'Efficiency for Real-Time Conversation'
    bullet: 'Making speech and omni models fast and cheap enough for real-time spoken conversation.'
    summary: >-
      Full-duplex systems require speech and omni models that are fast and cheap enough for real-time conversation. We study KV cache quantization in OmniKVQuant, token compression in Out of Sight, Still in Mind, speculative decoding in VSpark, and early end-of-turn detection in Speculative End-Turn Detector. The end-turn detector paper is our published work closest to turn-taking.
  - id: 'understanding'
    title: 'Auditory Grounding and Model Internals'
    bullet: 'Studying auditory knowledge, attention, and how language models write weights, informing full-duplex models.'
    summary: >-
      Building toward full-duplex systems requires understanding how models ground audio inputs, allocate attention, and construct model parameters. We study how models use auditory knowledge, attention, and grounding inside, and what structures language models build when they write network weights directly. Representative papers include Attention Sink in Omni-LLMs, Who Wins the Conflict, and Weight-Space Programming Doesn't Need Transformers, alongside our joint auditory-knowledge papers AudioBERT and Imagine to Hear.

people:
  - id: 'hyunjong'
    role: 'Core Researcher'
    affiliation: 'Ph.D. student, Graduate School of AI, POSTECH'
    interests:
      - 'Multimodal and speech evaluation'
      - 'Voice-agent and simulator-based evaluation'
      - 'Weight-space programming'
      - 'Harness evolution for agents'
    bio: >-
      Hyunjong Ok is a Ph.D. student at POSTECH advised by Prof. Jaeho Lee. Hyunjong studies diagnostic benchmarks, voice-agent and simulator-based evaluation, weight-space programming, and how language models use knowledge grounded in other modalities.
  - id: 'suho'
    role: 'Core Researcher'
    affiliation: 'M.S. student, Electrical Engineering, KAIST'
    interests:
      - 'Large language models'
      - 'Multimodal learning'
      - 'Speech processing'
      - 'Efficient and interpretable omni-LLMs'
    bio: >-
      Suho Yoo is an M.S. student at KAIST advised by Prof. Joon Son Chung. Suho works on multimodal learning and speech processing, with recent papers on efficient omni-LLMs and interpretability of audio and omni-LLMs.

